name: Build F2B Mobile Release

# Builds the QQ机器人 (f2b) APK and the Ubuntu-arm64 rootfs image, then
# publishes both as a GitHub Release of THIS repository. The APK's first-run
# helper reads the rootfs URL from app/src/main/assets/qqrobot-rootfs-url.txt,
# which this workflow regenerates to point at this repo's own "latest" release,
# so no hardcoded repository name is needed.
#
# Trigger: workflow_dispatch (manual, with optional version input) or push of a
# tag matching v*. Release assets:
#   termux-app_<version>-f2b-debug_{arm64-v8a,universal}.apk + _sha256sums
#   rootfs-arm64.tar.xz   (docker-exported ubuntu:24.04 arm64 container)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver version for this build (e.g. 0.1.0). Default: 0.1.0'
        required: false
        default: '0.1.0'

permissions:
  contents: write

concurrency:
  group: f2b-release
  cancel-in-progress: false

env:
  F2B_VERSION: ${{ github.event.inputs.version || '0.1.0' }}

jobs:
  build-apk:
    name: Build APK (debug, universal + arm64)
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Point first-run rootfs URL at this build's versioned release asset
        shell: bash {0}
        run: |
          # Fixed-tag URL (not "latest"): this release is a prerelease, and
          # /releases/latest/download/ only resolves for non-prerelease builds.
          printf '%s' "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${{ env.F2B_VERSION }}/rootfs-arm64.tar.xz" \
            > app/src/main/assets/qqrobot-rootfs-url.txt
          echo "rootfs URL injected: $(cat app/src/main/assets/qqrobot-rootfs-url.txt)"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK (platform 36, build-tools, NDK 29)
        shell: bash {0}
        run: |
          set -euxo pipefail
          # Runner images ship cmdline-tools; ensure the exact SDK components the build needs.
          CMDLINE_TOOLS="$ANDROID_HOME/cmdline-tools/latest/bin"
          if [ ! -x "$CMDLINE_TOOLS/sdkmanager" ]; then
            echo "::error::sdkmanager not found at $CMDLINE_TOOLS" >&2
            ls -R "$ANDROID_HOME" 2>/dev/null | head -40 || true
            exit 1
          fi
          yes | "$CMDLINE_TOOLS/sdkmanager" --licenses >/dev/null 2>&1 || true
          MISSING=""
          [ -d "$ANDROID_HOME/platforms/android-36" ] || MISSING="$MISSING platforms;android-36"
          [ -d "$ANDROID_HOME/build-tools/36.0.0" ] || MISSING="$MISSING build-tools;36.0.0"
          [ -d "$ANDROID_HOME/ndk/29.0.14206865" ] || MISSING="$MISSING ndk;29.0.14206865"
          if [ -n "$MISSING" ]; then
            # shellcheck disable=SC2086
            "$CMDLINE_TOOLS/sdkmanager" --install $MISSING >/dev/null
          else
            echo "All required SDK components already present"
          fi

      - name: Build debug APKs
        shell: bash {0}
        env:
          TERMUX_APP_VERSION_NAME: ${{ env.F2B_VERSION }}
          TERMUX_APK_VERSION_TAG: v${{ env.F2B_VERSION }}-f2b-debug
        run: |
          set -euxo pipefail
          if ! printf "%s" "${{ env.F2B_VERSION }}" | grep -qP '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9a-zA-Z.-]+)?$'; then
            echo "::error::version '${{ env.F2B_VERSION }}' is not valid semver (major.minor.patch)." >&2
            exit 1
          fi
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify and checksum APKs
        shell: bash {0}
        run: |
          set -eu
          APK_DIR="$PWD/app/build/outputs/apk/debug"
          PREFIX="termux-app_v${{ env.F2B_VERSION }}-f2b-debug"
          for abi in arm64-v8a universal; do
            test -f "$APK_DIR/${PREFIX}_${abi}.apk" || { echo "missing $abi apk"; ls "$APK_DIR"; exit 1; }
          done
          (cd "$APK_DIR" && sha256sum "${PREFIX}_arm64-v8a.apk" "${PREFIX}_universal.apk" > "${PREFIX}_sha256sums")
          echo "APK_DIR_PATH=$APK_DIR" >> "$GITHUB_ENV"
          echo "APK_BASENAME_PREFIX=$PREFIX" >> "$GITHUB_ENV"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v6
        with:
          name: f2b-apks
          path: |
            ${{ env.APK_DIR_PATH }}/${{ env.APK_BASENAME_PREFIX }}_arm64-v8a.apk
            ${{ env.APK_DIR_PATH }}/${{ env.APK_BASENAME_PREFIX }}_universal.apk
            ${{ env.APK_DIR_PATH }}/${{ env.APK_BASENAME_PREFIX }}_sha256sums
          if-no-files-found: error

  build-rootfs:
    name: Build Ubuntu arm64 rootfs (docker export + xz)
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Set up QEMU (cross-arch emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build arm64 rootfs image
        shell: bash {0}
        env:
          # GitHub runner reaches github.com directly; a mirror proxy would only
          # add a failure point, so force install.sh's --github-proxy to 0 (直连).
          GITHUB_PROXY: 0
        run: |
          set -euxo pipefail
          docker buildx build \
            --platform linux/arm64 \
            --build-arg GITHUB_PROXY="$GITHUB_PROXY" \
            --load \
            -t qqrobot-rootfs:arm64 \
            ./rootfs-builder

      - name: Export container as tar and compress to xz
        shell: bash {0}
        run: |
          set -euxo pipefail
          CID="$(docker create qqrobot-rootfs:arm64)"
          trap 'docker rm -f "$CID" >/dev/null 2>&1 || true' EXIT
          # xz -6 (not -9) keeps within GitHub runner RAM while still compact.
          docker export "$CID" | xz -6 -T0 > rootfs-arm64.tar.xz
          ls -lh rootfs-arm64.tar.xz

      - name: Build proot runtime asset (termux deb repackaged, no apt)
        # proot 安装绕开 apt(apt 二进制编译期硬编码 com.termux 路径, 改名包上
        # 无法读取配置)。改走资产直下: 从 termux 官方源取 proot 及其依赖
        # libtalloc/libandroid-shmem 三个 deb, 解包重组为 proot-arm64.tar.xz,
        # tar 内路径以 usr/ 为根(解压到 $PREFIX 即得 bin/proot + libexec/proot/* + lib/*.so)。
        shell: bash {0}
        run: |
          set -euxo pipefail
          BASE="https://packages.termux.dev/apt/termux-main/pool/main"
          WORK="$(mktemp -d)"
          cd "$WORK"
          # 固定版本(与真机 bootstrap 2026.02.12-r1 同代): proot 5.1.107.101
          # deps 均无更多依赖(libtalloc→libc, libandroid-shmem→libc; libc 在 bootstrap 内)
          for f in \
            "$BASE/p/proot/proot_5.1.107.101_aarch64.deb" \
            "$BASE/libt/libtalloc/libtalloc_2.5.0_aarch64.deb" \
            "$BASE/liba/libandroid-shmem/libandroid-shmem_0.7_aarch64.deb"; do
            curl -fL --retry 5 --retry-delay 3 -O "$f"
          done
          ls -la *.deb
          ROOT="$WORK/tree"
          for d in *.deb; do dpkg-deb -x "$d" "$ROOT"; done
          find "$ROOT" -type f -o -type l | sed "s|$ROOT||" | sort | head -20
          # deb 内路径为 data/data/com.termux/files/usr/... → 组装时只取 usr/ 内容
          SRCDIR="$ROOT/data/data/com.termux/files/usr"
          test -x "$SRCDIR/bin/proot" && test -x "$SRCDIR/libexec/proot/loader"
          (cd "$SRCDIR" && tar -cJf "$GITHUB_WORKSPACE/proot-arm64.tar.xz" \
             bin/proot bin/termux-chroot \
             libexec/proot/loader libexec/proot/loader32 \
             lib/libtalloc.so lib/libtalloc.so.2 lib/libtalloc.so.2.5.0 \
             lib/libandroid-shmem.so)
          ls -lh "$GITHUB_WORKSPACE/proot-arm64.tar.xz"

      - name: Upload rootfs + proot artifacts
        uses: actions/upload-artifact@v6
        with:
          name: f2b-rootfs
          path: |
            rootfs-arm64.tar.xz
            proot-arm64.tar.xz
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [build-apk, build-rootfs]
    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v6
        with:
          name: f2b-apks
          path: dist/apks/

      - name: Download rootfs artifact
        uses: actions/download-artifact@v6
        with:
          name: f2b-rootfs
          path: dist/rootfs/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.F2B_VERSION }}
          name: QQ机器人 F2B v${{ env.F2B_VERSION }}
          body: |
            ## QQ编程机器人 · 安卓免 Root 版 v${{ env.F2B_VERSION }}

            ### 包含
            - APK（universal / arm64-v8a，debug 签名，安装即用）
            - rootfs-arm64.tar.xz（Ubuntu 24.04 arm64 容器，APK 首次启动自动下载）
            - proot-arm64.tar.xz（Termux proot 运行时，首次启动自动下载并解压，不经 apt）

            ### 安装
            1. 安装 termux-app_v${{ env.F2B_VERSION }}-f2b-debug_universal.apk
            2. 打开应用，等待首次启动自动下载并解压容器（需网络，约 1.5–2GB）
            3. 首次扫码登录 QQ，机器人常驻运行

            > 凭据不入包：NapCat webui token 首启随机生成；后端 token 为本地固定串。
          files: |
            dist/apks/termux-app_*-f2b-debug_arm64-v8a.apk
            dist/apks/termux-app_*-f2b-debug_universal.apk
            dist/apks/termux-app_*-f2b-debug_sha256sums
            dist/rootfs/rootfs-arm64.tar.xz
            dist/rootfs/proot-arm64.tar.xz
          draft: false
          prerelease: true
          fail_on_unmatched_files: true
          # Re-running the same version (e.g. after a fix) must overwrite assets.
          overwrite: true